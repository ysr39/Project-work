server {
    listen 443 ssl http2;
    server_name api.taxipool.app;

    # ── TLS ───────────────────────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/api.taxipool.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.taxipool.app/privkey.pem;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options         DENY        always;
    add_header X-Content-Type-Options  nosniff     always;
    add_header Referrer-Policy         strict-origin-when-cross-origin always;

    # ── Request limits ────────────────────────────────────────────────────────
    client_max_body_size 10M;

    # ── Stripe webhook (raw body, higher rate limit) ──────────────────────────
    location = /api/v1/payments/webhook {
        limit_req zone=stripe_webhook burst=10 nodelay;
        proxy_pass         http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Preserve raw body so Stripe signature verification works
        proxy_request_buffering off;
    }

    # ── Auth endpoints (strict rate limit) ───────────────────────────────────
    location ~* ^/api/v1/auth/(send-otp|verify-otp) {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass         http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── WebSocket (Socket.IO) ─────────────────────────────────────────────────
    location /socket.io/ {
        limit_conn ws_conn 5;
        proxy_pass         http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── REST API ───────────────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api_global burst=20 nodelay;
        proxy_pass         http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # ── Health ────────────────────────────────────────────────────────────────
    location = /health {
        access_log off;
        proxy_pass http://api_backend/api/health;
    }
}
