version: '3.9'

# ── Production overlay ─────────────────────────────────────────────────────────
# Usage:
#   docker compose \
#     -f infrastructure/docker/docker-compose.yml \
#     -f infrastructure/docker/docker-compose.prod.yml \
#     up -d
#
# Requires: POSTGRES_PASSWORD, REDIS_PASSWORD, and all app secrets in
# apps/api/.env.production

services:
  postgres:
    image: postgis/postgis:15-3.4
    restart: always
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports: []   # not exposed externally in production

  redis:
    image: redis:7.2-alpine
    restart: always
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    ports: []

  api:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
      target: runner        # full production image
    restart: always
    env_file:
      - ../../apps/api/.env.production
    volumes: []             # no bind mounts in production
    command: []             # use CMD from Dockerfile (migrate-and-start.sh)
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1'
          memory: 512M

  nginx:
    image: nginx:1.25-alpine
    container_name: taxipool_nginx
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  nginx_logs:
