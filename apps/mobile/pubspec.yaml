name: taxipool
description: Taxi pooling platform — Rider & Driver app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Navigation
  go_router: ^13.2.0

  # Dependency injection
  get_it: ^7.7.0
  injectable: ^2.4.2

  # Network
  dio: ^5.4.3
  retrofit: ^4.1.0
  pretty_dio_logger: ^1.3.1

  # WebSocket
  socket_io_client: ^2.0.3+1

  # Local storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  # Maps
  google_maps_flutter: ^2.6.1
  geolocator: ^11.1.0
  geocoding: ^3.0.0
  flutter_polyline_points: ^2.1.0

  # UI
  pinput: ^5.0.0
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  lottie: ^3.1.2
  flutter_svg: ^2.0.10+1

  # Stripe payments
  flutter_stripe: ^10.1.1

  # Notifications
  firebase_core: ^3.3.0
  firebase_messaging: ^15.1.0
  flutter_local_notifications: ^17.2.1+2

  # Utils
  intl: ^0.19.0
  uuid: ^4.4.0
  permission_handler: ^11.3.1
  url_launcher: ^6.3.0
  flutter_rating_bar: ^4.0.1
  dash_chat_2: ^0.0.21

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  injectable_generator: ^2.4.3
  retrofit_generator: ^8.1.0
  json_serializable: ^6.8.0
  json_annotation: ^4.9.0
  mocktail: ^1.0.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
